<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Auth Test</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
    <h2>Test Social Sign-In (Firebase)</h2>
    <p>Use this tool to generate a real Firebase ID Token for testing your Swagger API.</p>

    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <button id="googleBtn" style="padding: 10px 20px; font-size: 16px; background-color: #4285F4; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Sign in with Google
        </button>

        <button id="facebookBtn" style="padding: 10px 20px; font-size: 16px; background-color: #1877F2; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Sign in with Facebook
        </button>

        <button id="logoutBtn" style="padding: 10px 20px; font-size: 16px; background-color: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer; display: none;">
            Sign out
        </button>
    </div>

    <div style="margin-top: 20px;">
        <h3>Provider: <span id="providerLabel" style="color: #555;">—</span></h3>
        <h3>Your ID Token:</h3>
        <textarea id="tokenBox" rows="8" style="width: 100%; max-width: 600px; padding: 10px;" readonly placeholder="Your token will appear here..."></textarea>
        <br>
        <button onclick="copyToken()" style="margin-top: 10px; padding: 5px 10px;">Copy Token</button>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, FacebookAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBv7F1RNGJJP281R93zHezxX_wc3VMe73I",
            authDomain: "aroundufast.firebaseapp.com",
            projectId: "aroundufast",
            storageBucket: "aroundufast.firebasestorage.app",
            messagingSenderId: "65663180907",
            appId: "1:65663180907:web:1a41bf89d1bbe6adaa112e",
            measurementId: "G-T5R1C9N2ES"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const googleBtn = document.getElementById('googleBtn');
        const facebookBtn = document.getElementById('facebookBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const tokenBox = document.getElementById('tokenBox');
        const providerLabel = document.getElementById('providerLabel');

        function onLoginSuccess(result) {
            return result.user.getIdToken().then((token) => {
                tokenBox.value = token;
                const provider = result.user.providerData[0]?.providerId || 'unknown';
                providerLabel.textContent = provider;
                googleBtn.style.display = 'none';
                facebookBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
            });
        }

        googleBtn.addEventListener('click', () => {
            signInWithPopup(auth, new GoogleAuthProvider())
                .then(onLoginSuccess)
                .catch((error) => {
                    console.error("Google login failed:", error);
                    alert("Google Login Failed: " + error.message);
                });
        });

        facebookBtn.addEventListener('click', () => {
            signInWithPopup(auth, new FacebookAuthProvider())
                .then(onLoginSuccess)
                .catch((error) => {
                    console.error("Facebook login failed:", error);
                    alert("Facebook Login Failed: " + error.message);
                });
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                tokenBox.value = '';
                providerLabel.textContent = '—';
                googleBtn.style.display = 'inline-block';
                facebookBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'none';
            });
        });

        window.copyToken = function() {
            tokenBox.select();
            document.execCommand('copy');
            alert("Token copied to clipboard!");
        }
    </script>
</body>
</html>
