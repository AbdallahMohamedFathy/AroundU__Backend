<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Auth Test</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
    <h2>Test Google Sign-In (Firebase)</h2>
    <p>Use this tool to generate a real Firebase ID Token for testing your Swagger API.</p>
    
    <button id="loginBtn" style="padding: 10px 20px; font-size: 16px; background-color: #4285F4; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Sign in with Google
    </button>
    
    <button id="logoutBtn" style="padding: 10px 20px; font-size: 16px; background-color: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer; display: none;">
        Sign out
    </button>

    <div style="margin-top: 20px;">
        <h3>Your ID Token:</h3>
        <textarea id="tokenBox" rows="8" style="width: 100%; max-width: 600px; padding: 10px;" readonly placeholder="Your token will appear here..."></textarea>
        <br>
        <button onclick="copyToken()" style="margin-top: 10px; padding: 5px 10px;">Copy Token</button>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        // ⚠️ REPLACE THIS CONFIG WITH YOUR FIREBASE WEB CONFIG ⚠️
        // You can find this in Firebase Console -> Project Settings -> General -> Web Apps
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyBv7F1RNGJJP281R93zHezxX_wc3VMe73I",
            authDomain: "aroundufast.firebaseapp.com",
            projectId: "aroundufast",
            storageBucket: "aroundufast.firebasestorage.app",
            messagingSenderId: "65663180907",
            appId: "1:65663180907:web:1a41bf89d1bbe6adaa112e",
            measurementId: "G-T5R1C9N2ES"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const tokenBox = document.getElementById('tokenBox');

        loginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider).then((result) => {
                return result.user.getIdToken();
            }).then((token) => {
                tokenBox.value = token;
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
            }).catch((error) => {
                console.error("Login failed:", error);
                alert("Login Failed: " + error.message);
            });
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                tokenBox.value = '';
                loginBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'none';
            });
        });
        
        window.copyToken = function() {
            tokenBox.select();
            document.execCommand('copy');
            alert("Token copied to clipboard!");
        }
    </script>
</body>
</html>
